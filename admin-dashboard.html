<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransitHub - Super User Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <header class="bg-blue-900 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold">TransitHub Admin Dashboard</h1>
        <button id="adminLogout" class="bg-red-600 px-4 py-2 rounded text-sm font-bold hover:bg-red-700 transition">Logout</button>
    </header>
    <main class="max-w-6xl mx-auto p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl shadow border border-gray-100">
                <h3 class="text-gray-500 text-sm font-bold uppercase tracking-wider">Total Platform Receivables</h3>
                <p id="totalReceivables" class="text-3xl font-extrabold text-blue-900 mt-2">Ksh 0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border border-gray-100">
                <h3 class="text-gray-500 text-sm font-bold uppercase tracking-wider">Active Listings Count</h3>
                <p id="totalListingsCount" class="text-3xl font-extrabold text-green-700 mt-2">0</p>
            </div>
        </div>
    </main>
    
</body>
</html>
