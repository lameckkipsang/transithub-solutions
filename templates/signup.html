<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="text-gray-800 font-sans min-h-screen flex flex-col bg-gray-50">
    <nav class="bg-white shadow-sm py-4 px-8 flex justify-between items-center">
        <a href="../index.html" class="flex flex-row items-center gap-3 font-bold text-xl tracking-tight text-blue-900">
            <img src="../assets/logo.png" alt="TransitHub Logo" class="h-10 w-10 rounded-full object-cover border border-gray-200 shadow-sm">
            TransitHub Solutions
        </a>
        <a href="../index.html" class="text-gray-600 hover:text-blue-600 font-medium text-sm transition">← Back to Home</a>
    </nav>
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">          
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-blue-900">Create Account</h2>
                <p class="text-sm text-gray-500 mt-2">Join TransitHub and start listing vehicles today</p>
            </div>
            <form id="signupForm" class="space-y-5">
                <div>
                    <label for="signupName" class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="signupName" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition text-sm" placeholder="Lameck Kipsang">
                </div>
                <div>
                    <label for="signupEmail" class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="signupEmail" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition text-sm" placeholder="name@example.com">
                </div>
                <div>
                    <label for="signupPassword" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input type="password" id="signupPassword" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold hover:bg-blue-800 transition duration-200 shadow-md mt-2">Sign Up</button>
            </form>
            <p class="text-center text-sm text-gray-600 mt-6">Already have an account? <a href="login.html" class="text-blue-600 font-semibold hover:underline">Log in here</a></p>
        </div>
    </main>
<footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm mt-auto">
    <p>&copy; 2026 TransitHub Solutions. All rights reserved.</p>
</footer>
<script src="../js/script.js"></script>
</body>
</html>
