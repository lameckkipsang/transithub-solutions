<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="text-gray-800 font-sans h-full flex flex-col">
    <nav class="bg-white shadow-sm py-4 px-8 flex justify-between items-center">
        <a href="../index.html" class="flex flex-row items-center gap-3 font-bold text-xl tracking-tight text-blue-900">
            <img src="../assets/logo.png" alt="TransitHub Logo" class="h-10 w-10 rounded-full object-cover border border-gray-200 shadow-sm">
            TransitHub Solutions
        </a>
        <a href="../index.html" class="text-gray-600 hover:text-blue-600 font-medium text-sm transition">← Back to Home</a>
    </nav>
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
            
            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-blue-900">Welcome Back</h2>
                <p class="text-sm text-gray-500 mt-2">Please sign in to your TransitHub account</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label for="loginEmail" class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition text-sm" placeholder="name@example.com">
                </div>

                <div>
                    <label for="loginPassword" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition text-sm" placeholder="••••••••">
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-600 cursor-pointer">
                        <input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 mr-2"> Remember me
                    </label>
                    <a href="#" class="text-blue-600 hover:underline font-medium">Forgot password?</a>
                </div>

                <button type="submit" class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold hover:bg-blue-800 transition duration-200 shadow-md">Sign In</button>
            </form>

            <p class="text-center text-sm text-gray-600 mt-6">Don't have an account? <a href="signup.html" class="text-blue-600 font-semibold hover:underline">Create one here</a></p>
        </div>
    </main>
    <footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm mt-auto">
        <p>&copy; 2026 TransitHub Solutions. All rights reserved.</p>
    </footer>
<script src="../js/script.js"></script>
</body>
</html>
