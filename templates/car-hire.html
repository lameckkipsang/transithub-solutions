<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Hire</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex flex-col h-full font-sans text-gray-800">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="../index.html" class="flex flex-row items-center gap-3 flex-shrink-0 font-bold text-xl tracking-tight text-blue-900">
                    <img src="assets/logo.png" alt="TransitHub Logo" class="h-10 w-10 rounded-full object-cover border border-gray-200 shadow-sm">
                    TransitHub Solutions
                </a>
                <div class="hidden md:flex space-x-6 font-semibold text-sm items-center">
                    <a href="../index.html" class="text-gray-700 hover:text-blue-600 transition">Home</a>
                    <a href="templates/about.html" class="text-gray-700 hover:text-blue-600 transition">About Us</a>
                    <a href="templates/contact.html" class="text-gray-700 hover:text-blue-600 transition">Contact</a>
                    <a href="templates/login.html" class="text-gray-700 hover:text-blue-600 transition ml-4">Login</a>
                </div>
                <div class="md:hidden flex items-center">
                    <input type="checkbox" id="mobile-menu-toggle" class="peer hidden">
                    <label for="mobile-menu-toggle" class="text-gray-800 cursor-pointer p-2 hover:bg-gray-100 rounded-lg transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </label>

                    <div class="absolute top-16 left-0 w-full bg-white shadow-lg border-t border-gray-100 hidden peer-checked:flex flex-col py-2 px-4 z-50">
                        <a href="../index.html" class="block font-semibold text-blue-600 py-3 border-b border-gray-50">Home</a>
                        <a href="templates/about.html" class="block font-semibold text-gray-700 hover:text-blue-600 py-3 border-b border-gray-50 transition">About Us</a>
                        <a href="templates/contact.html" class="block font-semibold text-gray-700 hover:text-blue-600 py-3 border-b border-gray-50 transition">Contact</a>
                        <a href="templates/login.html" class="block font-semibold text-gray-700 hover:text-blue-600 py-3 transition">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <main class="flex-grow max-w-7xl mx-auto px-4 py-12 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div id="carListingsContainer" class="lg:col-span-2 space-y-6">
            <h2 class="text-3xl font-bold border-b pb-4">Available for Hire</h2>
            <div id="dynamicCardsContainer" class="space-y-6"></div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100 h-fit sticky top-24">
            <h3 class="text-xl font-bold text-blue-900 mb-4">List Your Vehicle</h3>
            <p class="text-sm text-gray-500 mb-6">Earn money by renting out your car securely.</p>
            
            <form id="carListingForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Vehicle Make & Model</label>
                    <input type="text" id="carMake" class="w-full px-3 py-2 border rounded-md" placeholder="e.g. Nissan X-Trail">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Detailed Description</label>
                    <textarea rows="3" id="carDesc" class="w-full px-3 py-2 border rounded-md" placeholder="Capacity, condition, rules..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Rental Price per Day</label>
                    <input type="text" id="carPrice" required class="w-full px-3 py-2 border rounded-md" placeholder="e.g. Ksh 6,500 / day">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1"> Rental Fee Vehicle Category</label>
                    <select id="carCategory" class="w-full px-3 py-2 border rounded-md bg-white">
                        <option value="mini">Mini Car (e.g., Demio) - Ksh 5,000 / month</option>
                        <option value="sedan">Sedan - Ksh 6,000 / month</option>
                        <option value="suv5">5-Seater SUV - Ksh 8,000 / month</option>
                        <option value="suv7">7-Seater SUV - Ksh 12,000 / month</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Upload Car Images</label>
                    <input type="file" id="carImage" accept="image/*" multiple class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border rounded-md p-1">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-md hover:bg-blue-700 mt-2">
                    Submit Listing
                </button>
            </form>
        </div>
        
    </main>
    <span class="payment-button"><button type="submit" class="w-30 text-center bg-blue-600 mb-10 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md"> <a href="payment.html">  Pay </a> </button></span>
    <br>
    <br>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm mt-auto">
        <p>&copy; 2026 TransitHub Solutions. All rights reserved.</p>
    </footer>
    </main>
<script src="../js/script.js"></script>  
</body>
</html>
